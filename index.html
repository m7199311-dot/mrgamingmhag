            align-items: center;
            gap: 10px;
        }

        .user-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #00e5ff;
            object-fit: cover;
            box-shadow: 0 0 10px #00e5ff;
            background-color: #111;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px #00e5ff;
            text-transform: uppercase;
        }

        .controls-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #00e5ff;
        }

        .switch-label {
            font-size: 11px;
            font-weight: bold;
            color: #00e5ff;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 650px) {

                grid-template-columns: 1fr;
            }

            color: #00e5ff;
            margin-bottom: 5px;
            display: block;

            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #ff0055;
        }

        .color-box {

            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #222;
            transition: transform 0.2s;
        }

        .color-box:hover { transform: scale(1.05); }

            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00e5ff;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .picker-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .color-preview-large {
            width: 35px;
            height: 35px;
            border-radius: 4px;
            border: 1px solid #fff;
            background: #FF0000;
        }

            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            background: none;

            flex-direction: column;
            gap: 4px;
        }

            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        }

            border-radius: 6px;
            padding: 8px;
            color: #fff;

            gap: 8px;

            color: #fff;

            font-weight: bold;

            gap: 8px;
            margin-top: 5px;
        }

        .btn-action {

            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;

        .btn-reset {

            color: #ff0055;
            border: 1px solid #ff0055;
        }

            display: none;
            margin-top: 10px;
        }

            gap: 10px;
            margin-bottom: 12px;

            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;

        "[FF0000]☠️ একাই যথেষ্ট আমি ☠️",
        "[00FFFF]❄️ নীরবতার শক্তি ❄️",
        "[FF0055]💔 হৃদয় শূন্য হয়ে গেছে 💔",
        "[FFFF00]⚡ দ্রুততার সাথে জয় ⚡",
        "[00FF00]🐍 বিষধর এক প্লেয়ার 🐍",
        "[800080]👑 সেরা হতে আসছি 👑",
        "[FFA500]🦁 আমার নিয়মই শেষ 🦁",
        "[FF0000]💣 ম্যাচ ফিনিশার আমি 💣",
        "[00FFFF]👑 আসল রাজা আমি 👑"
    ];

    const englishBios = [
        "[FF0000]👑 [FFFF00]KING [00FF00]OF [00FFFF]FF",
        "[FF0055]💔 [FFFFFF]BROKEN [000000]HEART",
        "[00FFFF]⚡ [FF0000]ONE [FFFF00]TAP [00FF00]GOD",
        "[FF0000]☠️ [000000]NO [FFFFFF]MERCY",
        "[FFA500]🔥 [FF0000]ATTITUDE [FFFF00]BOY",
        "[800080]🖤 [FF0055]SAD [FFFFFF]LIFE",
        "[00FF00]🎯 [FF0000]ONLY [FFFF00]HEADSHOT",
        "[00FFFF]❄️ [FFFFFF]SILENT [000000]KILLER",
        "[FF0000]😈 [FFFF00]DEVIL [00FF00]INSIDE",
        "[FF9900]👑 [FFFFFF]MR [FF0000]GAMER"
    ];

    document.addEventListener('DOMContentLoaded', function() {
        const modeToggle = document.getElementById('modeToggle');
        const glowToggle = document.getElementById('glowToggle');
        const btnEnglishTab = document.getElementById('btnEnglishTab');
        const btnBanglaTab = document.getElementById('btnBanglaTab');

        if (modeToggle) {
            modeToggle.addEventListener('change', function() {
                const genSection = document.getElementById('generatorSection');
                const biosSection = document.getElementById('readyBiosSection');

                if (this.checked) {
                    if (genSection) genSection.style.display = 'none';
                    if (biosSection) biosSection.style.display = 'block';
                    document.body.classList.add('dark-attitude-mode');
                    renderBioList();
                } else {
                    if (genSection) genSection.style.display = 'grid';
                    if (biosSection) biosSection.style.display = 'none';
                    document.body.classList.remove('dark-attitude-mode');
                }
            });
        }

        if (glowToggle) {
            glowToggle.addEventListener('change', function() {
                const statusText = document.getElementById('switchStatusText');
                const card = document.getElementById('mainCard');
                if (this.checked) {
                    if (statusText) statusText.innerText = "RGB ON";
                    if (card) card.classList.add('rgb-active-card');
                } else {
                    if (statusText) statusText.innerText = "RGB OFF";
                    if (card) card.classList.remove('rgb-active-card');
                }
            });
        }

        if (btnEnglishTab) {
            btnEnglishTab.addEventListener('click', function() {
                currentTab = 'english';
                this.classList.add('active');
                if (btnBanglaTab) btnBanglaTab.classList.remove('active');
                renderBioList();
            });
        }

        if (btnBanglaTab) {
            btnBanglaTab.addEventListener('click', function() {
                currentTab = 'bangla';
                this.classList.add('active');
                if (btnEnglishTab) btnEnglishTab.classList.remove('active');
                renderBioList();
            });
        }
    });

    function renderBioList() {
        const container = document.getElementById('bioListContainer');
        if (!container) return;
        container.innerHTML = '';

        const listToRender = (currentTab === 'bangla') ? banglaSadDialogues : englishBios;

        listToRender.forEach(text => {
            const item = document.createElement('div');
            item.className = 'bio-item';
            item.innerHTML = `
                <span class="bio-text">${text}</span>
                <button class="btn-mini-copy" onclick="copyDirect('${text.replace(/'/g, "\\'")}')">কপি</button>
            `;
            container.appendChild(item);
        });
    }

    function copyDirect(text) {
        navigator.clipboard.writeText(text);
        alert('কপি হয়েছে!');
    }

    function updateUI(hex) {
        selectedColorHex = hex.toUpperCase();
        document.getElementById('largePreview').style.backgroundColor = selectedColorHex;
        document.getElementById('nativePicker').value = selectedColorHex;
        let r = parseInt(selectedColorHex.slice(1, 3), 16) || 0;
        let g = parseInt(selectedColorHex.slice(3, 5), 16) || 0;
        let b = parseInt(selectedColorHex.slice(5, 7), 16) || 0;
        document.getElementById('redRange').value = r;
        document.getElementById('greenRange').value = g;
        document.getElementById('blueRange').value = b;
    }

    function setColorHex(hex) { updateUI(hex); }
    function updateFromNative(hex) { updateUI(hex); }

    function updateFromSliders() {
        let r = parseInt(document.getElementById('redRange').value).toString(16).padStart(2, '0');
        let g = parseInt(document.getElementById('greenRange').value).toString(16).padStart(2, '0');
        let b = parseInt(document.getElementById('blueRange').value).toString(16).padStart(2, '0');
        let hex = `#${r}${g}${b}`;
        selectedColorHex = hex.toUpperCase();
        document.getElementById('largePreview').style.backgroundColor = selectedColorHex;
        document.getElementById('nativePicker').value = selectedColorHex;
    }

    function addText() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;
        const cleanHex = selectedColorHex.replace('#', '');
        generatedCode += `[${cleanHex}]${text}`;
        document.getElementById('codeArea').innerText = generatedCode;
        document.getElementById('charCount').innerText = generatedCode.length;
        const span = document.createElement('span');
        span.style.color = selectedColorHex;
        span.innerText = text + ' ';
        document.getElementById('previewArea').appendChild(span);
    }

    function copyCode() { if (!generatedCode) return; navigator.clipboard.writeText(generatedCode); alert('কোড কপি হয়েছে!'); }
    function resetAll() { generatedCode = ''; document.getElementById('codeArea').innerText = ''; document.getElementById('previewArea').innerHTML = ''; document.getElementById('charCount').innerText = '0'; }
</script>

</body>
</html>
